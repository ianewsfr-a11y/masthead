name: tests

# Every pull request, including a new preset list, runs the whole test suite.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MastHead and Horizon (pinned commit)
        run: python -m pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest -q
