<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MastHead for Horizon</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <nav class="side" aria-label="Main navigation">
    <div class="brand">
      <svg role="img" aria-label="MastHead" width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#0B0E14" stroke="#263043"></circle><circle cx="17" cy="20" r="6" fill="#F2A93B"></circle><rect x="2" y="20" width="30" height="13" fill="#0B0E14"></rect><path d="M3 20h28" stroke="#F2A93B" stroke-width="2"></path></svg>
      <div class="brand-text"><span class="brand-name">MastHead</span><span class="brand-sub">for Horizon</span></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-block">
      <span class="eyebrow">Domains</span>
      <ul class="domain-list" id="domain-list"></ul>
    </div>
    <div class="side-foot">
      <span class="eyebrow" id="side-foot-label">Local</span>
      <span class="side-foot-text" id="side-foot-text">Runs on this computer. Your sources and your AI key stay here.</span>
      <button type="button" class="btn" id="sign-out" hidden>Sign out</button>
    </div>
  </nav>
  <main id="main" tabindex="-1">
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
