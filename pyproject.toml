[project]
name = "masthead"
version = "0.0.1"
description = "MastHead for Horizon: a local web console for the Horizon news radar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Horizon is pinned to one commit: it is not published as a stable package yet.
    "horizon @ git+https://github.com/Thysrael/Horizon@323950050b079d054a009aa02198d89aae48e8da",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Verify HTTPS against the system's certificate store (antivirus, company proxies).
    "truststore>=0.10",
    # Time zones for scheduled runs, on systems without a zone database (Windows, slim images).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "cryptography>=42"]

[project.scripts]
masthead = "masthead.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["masthead"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
